<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline – LearnLocal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #3DBDB3;
      --dark: #1E2A38;
      --light: #F4F9FA;
    }
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--light);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      color: var(--dark);
    }
    .icon {
      width: 96px;
      height: 96px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }
    .icon svg { width: 48px; height: 48px; color: #fff; fill: none; stroke: currentColor; stroke-width: 2; }
    h1 { font-size: clamp(1.5rem, 5vw, 2.5rem); font-weight: 800; margin-bottom: 1rem; }
    p { color: #6B7280; font-size: 1rem; max-width: 400px; margin: 0 auto 2rem; line-height: 1.6; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--primary);
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .btn:hover { background: #2DA89E; }
    .cached-note {
      margin-top: 3rem;
      padding: 1rem 1.5rem;
      background: #fff;
      border: 1px solid #E5EAF0;
      border-radius: 12px;
      max-width: 400px;
    }
    .cached-note h3 { font-size: 0.875rem; font-weight: 700; color: var(--primary); margin-bottom: 0.5rem; }
    .cached-note p { font-size: 0.8rem; color: #6B7280; margin: 0; }
  </style>
</head>
<body>
  <div class="icon">
    <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
  </div>
  <h1>You're Offline</h1>
  <p>No internet connection detected. Don't worry — you can still access your cached lessons and content.</p>
  <button class="btn" onclick="window.location.reload()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
    </svg>
    Try Again
  </button>
  <div class="cached-note">
    <h3>📚 Cached Content Available</h3>
    <p>Your previously visited courses and lessons have been saved for offline access.</p>
  </div>
  <script>
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
